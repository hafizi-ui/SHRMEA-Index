<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Article · SHRMEA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6b45'/%3E%3Cpath d='M7 25C7 14 13 7 26 7c0 12-7 19-17 19' fill='%23a8cf8e'/%3E%3C/svg%3E" />
<style>
  .prose { max-width: 760px; margin: 0 auto; font-size: 1.06rem; }
  .prose h2 { font-size: 1.45rem; margin-top: 2.2rem; }
  .prose p { margin: 0 0 1.2rem; }
</style>
</head>
<body data-page="findings">

<section class="hero small">
  <div class="wrap">
    <a href="findings.html#publications" class="eyebrow" style="text-decoration:none">&larr; All publications</a>
    <h1 id="title" style="font-size:clamp(1.7rem,4vw,2.6rem)">Article</h1>
    <p class="lead" id="meta"></p>
  </div>
</section>

<section class="block">
  <div class="wrap">
    <article class="prose" id="body"></article>
    <div class="prose" id="links" style="display:flex;flex-wrap:wrap;gap:.6rem;margin-top:2rem"></div>
  </div>
</section>

<script src="data/articles.js"></script>
<script>
(function () {
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var id = new URLSearchParams(location.search).get("id");
  var a = (window.SHRMEA_ARTICLES || []).filter(function (x) { return x.id === id; })[0];
  if (!a) { document.getElementById("title").textContent = "Article not found"; document.getElementById("body").innerHTML = '<p>This article could not be found. <a href="findings.html#publications">Back to publications</a>.</p>'; return; }
  document.title = a.title + " · SHRMEA";
  document.getElementById("title").textContent = a.title;
  document.getElementById("meta").innerHTML = [a.authors, [a.type, a.venue, a.year, a.status].filter(Boolean).join(" · ")].filter(Boolean).map(esc).join("<br>");
  var html = "";
  if (a.abstract && !a.body) html += "<p>" + esc(a.abstract) + "</p>";
  (a.body || "").split(/\n\s*\n/).forEach(function (blk) {
    blk = blk.trim(); if (!blk) return;
    html += blk.indexOf("## ") === 0 ? "<h2>" + esc(blk.slice(3)) + "</h2>" : "<p>" + esc(blk).replace(/\n/g, "<br>") + "</p>";
  });
  document.getElementById("body").innerHTML = html;
  var l = "";
  if (a.link) l += '<a class="btn btn-green" href="' + esc(a.link) + '" target="_blank" rel="noopener">View original article</a>';
  if (a.doi) l += '<a class="btn btn-outline" href="https://doi.org/' + esc(a.doi) + '" target="_blank" rel="noopener">DOI: ' + esc(a.doi) + "</a>";
  if (a.pdf) l += '<a class="btn btn-outline" href="' + esc(a.pdf) + '" target="_blank" rel="noopener">Download PDF</a>';
  document.getElementById("links").innerHTML = l;
})();
</script>
<script src="assets/site.js"></script>
</body>
</html>
