<style>
  :root { --bg:#f7f3ea; --card:#fffdf8; --ink:#1f2d24; --muted:#63705f; --line:#e4dccb; --green:#1f6b45; --green2:#2f8a5b; --amber:#e0a33a; --err:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121a15; --card:#1a241e; --ink:#e8efe9; --muted:#9fb0a4; --line:#2c3a31; --green:#4fb07e; --green2:#6cc596; --amber:#f0b95a; --err:#f97066; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink);
         display: grid; place-items: center; padding: 16px;
         background-image: radial-gradient(900px 500px at 10% -10%, rgba(47,138,91,.22), transparent 60%), radial-gradient(700px 400px at 110% 110%, rgba(224,163,58,.20), transparent 60%); }
  .card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 32px 28px 26px; box-shadow: 0 20px 50px -20px rgba(20,50,30,.35); }
  .logo { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(135deg, var(--green), var(--green2)); margin-bottom: 18px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--amber); text-transform: uppercase; margin: 0 0 4px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
  .sub { margin: 6px 0 22px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field { position: relative; }
  input { width: 100%; font: inherit; font-size: 16px; padding: 12px 44px 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); outline: none; }
  input:focus { border-color: var(--green2); box-shadow: 0 0 0 4px rgba(47,138,91,.15); }
  .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); cursor: pointer; padding: 8px; border-radius: 8px; }
  button.go { width: 100%; margin-top: 16px; font: inherit; font-weight: 700; font-size: 15px; padding: 12px; border: 0; border-radius: 12px; cursor: pointer; color: #fff; background: linear-gradient(135deg, var(--green), var(--green2)); }
  button.go:disabled { opacity: .7; cursor: wait; }
  .msg { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--err); }
  .card.shake { animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .card.shake { animation: none; } }
  .foot { margin-top: 14px; font-size: 12px; color: var(--muted); text-align: center; }
  noscript { display: block; margin-top: 12px; color: var(--err); font-size: 13px; }
</style>
</head>

    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(CT));
    return new TextDecoder().decode(pt);
  }
  function show(html) {
    document.open(); document.write(html); document.close();
    var m = html.match(/<title>([^<]*)<\/title>/); if (m) document.title = m[1];
  }

  // Stay unlocked for this browser tab session
  (async function () {
    try {
      var saved = sessionStorage.getItem(KEY_STORE);
      if (saved) { show(await decrypt(b64(saved))); }
    } catch (e) { try { sessionStorage.removeItem(KEY_STORE); } catch (_) {} }
  })();

  var form = document.getElementById("gate"), pw = document.getElementById("pw"),
      go = document.getElementById("go"), msg = document.getElementById("msg");

  document.getElementById("eye").addEventListener("click", function () {
    pw.type = pw.type === "password" ? "text" : "password"; pw.focus();
  });

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!window.crypto || !crypto.subtle) { msg.textContent = "This browser can't unlock the page. Please open it over https in a modern browser."; return; }
    go.disabled = true; go.textContent = "Checking…"; msg.textContent = "";
    try {
      var raw = await deriveRaw(pw.value);
      var html = await decrypt(raw);
      try { sessionStorage.setItem(KEY_STORE, enc(raw)); } catch (_) {}
      show(html);
    } catch (err) {
      go.disabled = false; go.textContent = "Unlock";
      msg.textContent = "Incorrect password. Please try again.";
      pw.select();
      form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
    }
  });
})();
</script>
</body>
